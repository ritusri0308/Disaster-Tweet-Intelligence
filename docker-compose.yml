version: "3.8"

services:
  dashboard:
    build: .
    container_name: crisislens-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

  api:
    build: .
    container_name: crisislens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
