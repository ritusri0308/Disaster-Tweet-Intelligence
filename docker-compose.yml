version: "3.8"

# The licensed HumAID data, trained models and reports are mounted from the host, never copied into the image.
# The container runs as uid 1000: make sure ./data, ./models and ./reports are writable by that user.

services:
  dashboard:
    build: .
    container_name: crisislens-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  api:
    build: .
    container_name: crisislens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Set a key to require `X-API-Key` on /analyze, /feedback, /surges and /incidents
      CRISISLENS_API_KEY: ${CRISISLENS_API_KEY:-}
      # Comma-separated browser origins allowed to call the API (CORS is off when empty)
      CRISISLENS_CORS_ORIGINS: ${CRISISLENS_CORS_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # /ready is 503 until a healthy trained model is loaded
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
